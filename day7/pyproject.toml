[project]

name= "cli-automation"

version = "1.0.0"

description = "a command line automation tool."

authors = [

    { name = "monica", email = "monica@company.com" }

]

readme = "README.md"

requires-python = ">=3.10"

dependencies = [

    

    "typer>=0.9.0",
    "click>=8.0.0",

    

]

[project.optional-dependencies]

dev = [

    "pytest>=7.0.0",

    "black>=22.0.0",

    "flake8>=4.0.0",

    "isort>=5.0.0",

]

[build-system]

requires = ["setuptools>=61.0"]

build-backend = "setuptools.build_meta"
  
 
[tool.black]

line-length = 88

target-version = ["py313"]

[tool.isort]

profile = "black"
 